[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nac-calculus"
version = "0.2.0"
description = "Python toolkit for NAC v0.2 Universal Form · signature-only public interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "LostMaxi" },
]
keywords = [
    "architecture",
    "calculus",
    "ai-agent",
    "formal-methods",
    "axioms",
    "self-incompleteness",
    "falsifiability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/LostMaxi/nac-architecture-calculus"
Documentation = "https://github.com/LostMaxi/nac-architecture-calculus/blob/master/architecture-calculus.md"
Issues = "https://github.com/LostMaxi/nac-architecture-calculus/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nac*"]
exclude = ["tests*", "examples*"]
